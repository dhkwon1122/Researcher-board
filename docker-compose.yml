services:
  # 번들 postgres — 기본으로는 뜨지 않는다(profiles). 컨테이너 안에 DB 도 함께
  # 띄우고 싶을 때만: docker compose --profile bundled-db up -d
  # 기본 시나리오는 Windows 호스트의 PostgreSQL 에 붙는 것(아래 app 참고).
  db:
    image: postgres:16
    container_name: researcher_board_db
    profiles: ["bundled-db"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: researcher_board
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d researcher_board"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
      # 사내 값 고정(리터럴). 셸 환경변수의 영향을 받지 않도록 ${..} 우회를 쓰지 않음
      # — 특히 NO_PROXY 가 로컬 환경변수로 덮여 DB(db) 트래픽이 프록시로 새는 것을 방지.
      # 사외/공용 PyPI 빌드나 값 변경이 필요하면 이 값들을 직접 수정하거나
      # `docker build --build-arg PIP_INDEX_URL= ...` 로 빌드한다.
      args:
        PIP_INDEX_URL: "http://repository.samsungds.net/repository/proxy-pypi-files.pythonhosted.org/simple"
        PIP_TRUSTED_HOST: "repository.samsungds.net"
        PIP_CERT: ""
        HTTP_PROXY: "http://12.26.204.100:8080"
        HTTPS_PROXY: "http://12.26.204.100:8080"
        NO_PROXY: "localhost,127.0.0.1,db,::1,samsungds.net,*.samsungds.net,*.samsung.net,12.0.0.0/8,10.0.0.0/8,192.0.0.0/8,172.0.0.0/8"
    container_name: researcher_board_app
    # DATABASE_URL 은 .env 에서 지정(비밀번호 등). 미설정 시 Windows 호스트의
    # PostgreSQL(host.docker.internal:5432)을 기본값으로 시도한다.
    # 번들 DB(--profile bundled-db)로 쓸 땐 .env 에서 @db:5432 로 바꾼다.
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://postgres:postgres@host.docker.internal:5432/researcher_board}
      PORT: "8501"
      # AI 검색(Text2SQL)용 로컬 LLM. ollama 서비스(profile llm)를 가리킨다.
      LLM_BASE_URL: ${LLM_BASE_URL:-http://ollama:11434/v1}
      LLM_MODEL: ${LLM_MODEL:-qwen3.5:4b}
    # WSL 컨테이너 → Windows 호스트 접근용. Docker Desktop 은 자동이지만,
    # WSL 내 네이티브 docker 에서도 되도록 host-gateway 로 명시.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8501:8501"   # 호스트:컨테이너 (둘 다 8501)
    volumes:
      # 데이터는 이미지에 굽지 않고 호스트에서 마운트 (수정·교체 용이)
      - ./data:/app/data

  # 로컬 LLM (AI 검색용). 기본으로는 뜨지 않는다(profile llm).
  # 사용:  docker compose --profile llm up -d
  # 모델 1회 다운로드:  docker compose exec ollama ollama pull qwen2.5-coder:3b
  ollama:
    image: ollama/ollama:latest
    container_name: researcher_board_ollama
    profiles: ["llm"]
    # 모델 다운로드(registry.ollama.ai)는 사내 프록시를 타야 할 수 있음.
    environment:
      HTTP_PROXY: ${HTTP_PROXY:-http://12.26.204.100:8080}
      HTTPS_PROXY: ${HTTPS_PROXY:-http://12.26.204.100:8080}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,::1,ollama,app,samsungds.net,*.samsungds.net}
    ports:
      - "11434:11434"       # 호스트에서 직접 붙을 때 (선택)
    volumes:
      - ollama_models:/root/.ollama   # 받은 모델 캐시(재다운로드 방지)
    # ── GPU 는 옵셔널: docker-compose.gpu.yml 오버레이로 켠다 ──
    #   CPU(기본): docker compose --profile llm up -d
    #   GPU      : docker compose -f docker-compose.yml -f docker-compose.gpu.yml \
    #                --profile llm up -d
    #   (+ .env 에서 LLM_MODEL 을 큰 코더 모델로, 예: qwen3-coder:30b)

volumes:
  pgdata:
  ollama_models:
