services:
  db:
    image: postgres:16
    container_name: researcher_board_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: researcher_board
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d researcher_board"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
