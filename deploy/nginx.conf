# app 컨테이너 앞단 TLS 리버스 프록시. docker-compose.yml의 reverse-proxy
# 서비스가 이 파일을 마운트한다. 인증서는 certs/server.crt·certs/server.key
# (scripts/gen_self_signed_cert.sh로 생성한 자체 서명 인증서, 또는 운영
# 배포에서는 사내 PKI 발급 인증서로 같은 파일명 교체).
#
# X-Forwarded-For/-Proto를 설정해 전달한다 — app.py의 로그인 rate limit이
# 실제 클라이언트 IP를 구분하려면 TRUSTED_PROXY_COUNT=1(.env)과 짝을
# 맞춰야 한다(app.py, .env.example 참고). 이 nginx가 유일한 진입점이 아니게
# 되면(예: 사내 리버스 프록시가 이 앞에 하나 더 있으면) 그 홉 수만큼
# TRUSTED_PROXY_COUNT도 늘려야 한다.
server {
    listen 80;
    server_name _;
    # 평문 HTTP는 HTTPS로만 리다이렉트한다 — SESSION_COOKIE_SECURE=true
    # 환경에서 평문으로 로그인 폼을 그대로 서빙하면 세션 쿠키가 아예
    # 발급되지 않아 로그인이 조용히 실패한다.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # app.py MAX_CONTENT_LENGTH(기본 10MiB)보다 넉넉하게 잡아 nginx가
    # 먼저 잘라내지 않도록 한다.
    client_max_body_size 16m;

    location / {
        proxy_pass http://app:8501;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
